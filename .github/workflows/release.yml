name: release

# 打 tag（v 开头）即触发：云端编译 Linux / Windows 二进制并发布到 Releases。
# 也可在 Actions 页面手动触发（workflow_dispatch）。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: x86_64-linux
            asset: jybot-rs-x86_64-linux
            bin: jybot-rs
          - os: windows-latest
            name: x86_64-windows
            asset: jybot-rs-x86_64-windows.exe
            bin: jybot-rs.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --release --locked

      - name: Stage artifact (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp target/release/${{ matrix.bin }} dist/${{ matrix.asset }}
          chmod +x dist/${{ matrix.asset }}

      - name: Stage artifact (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/${{ matrix.bin }} dist/${{ matrix.asset }}

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/${{ matrix.asset }}
          fail_on_unmatched_files: true

      - name: Upload workflow artifact (for manual runs)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
